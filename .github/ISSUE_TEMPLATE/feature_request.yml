name: 💡 Feature Request / Wish
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: The feature or wish, and the problem it solves.
      placeholder: As a dispatcher I'd like to ... so that ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: How should it work?
      description: Describe the UI, command, behaviour, examples or mockups.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - MDT / CAD
        - Dispatch console
        - Query / Civilian (/char, /vreg)
        - Vehicles / Plates
        - Phone
        - Performance
        - Other
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues/discussions for a similar request.
          required: true
